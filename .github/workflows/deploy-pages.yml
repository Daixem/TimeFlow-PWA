name: TimeFlow auf GitHub Pages veröffentlichen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: timeflow-github-pages-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Aktuellen TimeFlow-Stand veröffentlichen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Node.js vorbereiten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: PWA prüfen
        run: npm test

      - name: PWA-Paket mit Commit-Version vorbereiten
        run: npm run build:pages
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: PWA hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages aktualisieren
        id: deployment
        uses: actions/deploy-pages@v4

      # Die geschützte Beta behält Anmeldung und D1-Daten im Hosting-Projekt,
      # liefert die App-Dateien jedoch direkt aus dem eben veröffentlichten
      # main-Release. Dadurch gibt es keine zweite, manuell zu pflegende Kopie.
      - name: Private Beta auf aktuellen Main-Stand prüfen
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA:0:12}"
          for attempt in {1..30}; do
            deployed="$(curl --fail --silent --show-error --max-time 15 \
              https://timeflow-connect.daixem.chatgpt.site/version.json \
              | jq -r '.build // empty' || true)"
            if [[ "$deployed" == "$expected" ]]; then
              curl --fail --silent --show-error --max-time 15 \
                https://timeflow-connect.daixem.chatgpt.site/js/private-account.js \
                | grep -q 'SOLL BIS HEUTE'
              echo "Private Beta verwendet Build $deployed und enthält SOLL BIS HEUTE."
              exit 0
            fi
            echo "Warte auf Private Beta (Versuch $attempt/30, aktuell: ${deployed:-unbekannt})"
            sleep 10
          done
          echo "Private Beta wurde nicht auf Build $expected aktualisiert." >&2
          exit 1
