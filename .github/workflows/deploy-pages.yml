name: TimeFlow auf GitHub Pages veröffentlichen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: timeflow-github-pages-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Aktuellen TimeFlow-Stand veröffentlichen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js vorbereiten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aktuellen Main-Commit verifizieren
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: PWA prüfen
        run: npm test

      - name: PWA-Paket mit Commit-Version vorbereiten
        run: npm run build:pages
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: PWA hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages aktualisieren
        id: deployment
        uses: actions/deploy-pages@v4

